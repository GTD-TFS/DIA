<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102f51">
<title>DIA · Exportar declaración</title>
<style>
:root{font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15334e;background:#edf3f8}
*{box-sizing:border-box}
body{min-height:100svh;margin:0;display:grid;place-items:center;padding:18px}
main{width:min(100%,520px);border:1px solid #d5e2ed;border-radius:22px;background:white;padding:clamp(18px,5vw,32px);box-shadow:0 12px 38px #16385416}
h1{margin:0 0 21px;font-size:26px;letter-spacing:-.6px}
textarea{width:100%;height:180px;resize:vertical;border:1px solid #c6d8e7;border-radius:13px;padding:12px;font:14px ui-monospace,monospace;line-height:1.5}
.actions{display:flex;gap:10px;margin-top:13px}
button{font:700 15px system-ui;border:0;border-radius:12px;min-height:52px;padding:12px 18px;cursor:pointer}
#paste{background:#e9f1f8;color:#153650;flex:1}
#download{background:#134f7f;color:white;flex:2}
#status{min-height:26px;color:#9b362e;font-size:13px;line-height:1.4;margin-top:13px}
</style>
</head>
<body><main>
<h1>DIA · Exportar TXT</h1>
<textarea id="source" aria-label="JSON de la declaración" placeholder="JSON de la declaración"></textarea>
<div class="actions"><button type="button" id="paste">PEGAR</button><button type="button" id="download">DESCARGAR TXT</button></div>
<div role="status" aria-live="polite" id="status"></div>
</main>
<script>
'use strict';
const input=document.getElementById('source');
const status=document.getElementById('status');
function stripFences(value){
 return value.trim().replace(/^\x60\x60\x60(?:json)?\s*/i,'').replace(/\s*\x60\x60\x60$/,'').trim();
}
function decodeUtf8Base64(encoded){
 if(typeof encoded!=='string'||!encoded.length||encoded.length%4!==0||!/^[A-Za-z0-9+/]+={0,2}$/.test(encoded))throw Error('Base64 inválido');
 const raw=atob(encoded);
 return new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(raw,c=>c.charCodeAt(0)));
}
function encodeUtf8Base64(value){
 const bytes=new TextEncoder().encode(value);
 let binary='';
 for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
 return btoa(binary);
}
function parseCandidate(value){
 const trimmed=stripFences(value);
 let data;
 try{data=JSON.parse(trimmed)}catch{
  const first=trimmed.indexOf('{'),last=trimmed.lastIndexOf('}');
  if(first<0||last<=first)throw Error('No se encontró un JSON válido');
  try{data=JSON.parse(trimmed.slice(first,last+1))}catch{throw Error('JSON incompleto o incorrecto')}
 }
 if(!data||typeof data!=='object'||Array.isArray(data))throw Error('La declaración debe ser un objeto JSON');
 return data;
}
function validateInterior(data){
 if(typeof data.declaracion!=='string'||!data.declaracion.trim())throw Error('Falta el relato de la declaración');
 if(!Array.isArray(data.objetos))throw Error('Falta la lista estructurada de objetos');
 for(const effect of data.objetos){
  if(!effect||typeof effect!=='object'||Array.isArray(effect)||typeof effect.tipo!=='string'||!effect.tipo.trim()||
   !(typeof effect.situacion==='string'||Array.isArray(effect.situacion)))throw Error('Existe un objeto sin tipo o situación');
 }
 if(data.preguntas_respuestas!==undefined&&!Array.isArray(data.preguntas_respuestas))throw Error('Preguntas y respuestas incorrectas');
 return data;
}
function buildFile(text){
 let inside=parseCandidate(text);
 if(inside.formato==='declaracion-ia-codificada-v5'){
  const decoded=decodeUtf8Base64(inside.contenido_base64_utf8);
  validateInterior(parseCandidate(decoded));
 }else{
  validateInterior(inside);
  const interior=JSON.stringify(inside);
  inside={
   formato:'declaracion-ia-codificada-v5',
   codificacion:'base64-utf8',
   contenido_base64_utf8:encodeUtf8Base64(interior)
  };
 }
 const decoded=decodeUtf8Base64(inside.contenido_base64_utf8);
 validateInterior(parseCandidate(decoded));
 if(inside.codificacion!=='base64-utf8')throw Error('Codificación incorrecta');
 const outer=JSON.stringify(inside);
 if(JSON.parse(outer).contenido_base64_utf8!==inside.contenido_base64_utf8)throw Error('Error de validación');
 return new Blob([outer],{type:'text/plain;charset=utf-8'});
}
document.getElementById('paste').addEventListener('click',async()=>{
 try{input.value=await navigator.clipboard.readText();status.textContent=''}catch{status.textContent='Pega el JSON en el recuadro.'}
});
document.getElementById('download').addEventListener('click',()=>{
 try{
  const file=buildFile(input.value);
  const url=URL.createObjectURL(file),link=document.createElement('a');
  link.href=url;link.download='DECLARACION_CODIFICADA.txt';document.body.appendChild(link);
  link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
  status.textContent='Archivo codificado y validado.';
 }catch(e){status.textContent=e instanceof Error?e.message:'No se pudo validar la declaración';}
});
</script>
</body></html>
