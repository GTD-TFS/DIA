<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d223b">
<title>DIA</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#091726;padding:20px}
main{width:min(100%,390px);display:grid;gap:14px}
button{width:100%;border:1px solid #274a69;border-radius:16px;min-height:76px;background:#173550;color:#fff;font:700 clamp(17px,4.7vw,21px) system-ui;cursor:pointer;letter-spacing:.02em;transition:background .15s,transform .15s}
button:hover{background:#225073}
button:active{transform:scale(.985)}
button:focus-visible{outline:3px solid #88caff;outline-offset:3px}
#copy{background:#e6f0ff;color:#0d2944;border:0;min-height:90px}
#copy:hover{background:#fff}
#choices{display:grid;gap:12px}
#choices[hidden]{display:none}
.provider{display:flex;align-items:center;justify-content:center;gap:12px}
.provider span{font-size:25px}
#copy:disabled{opacity:.6;cursor:progress}
</style>
</head>
<body>
<main>
<button type="button" id="copy">COPIAR PROMPT</button>
<div id="choices" hidden>
<button class="provider" type="button" data-url="https://chatgpt.com/"><span>✳</span>CHATGPT</button>
<button class="provider" type="button" data-url="https://gemini.google.com/app"><span>✦</span>GEMINI</button>
<button class="provider" type="button" data-url="https://claude.ai/new"><span>◆</span>CLAUDE</button>
</div>
</main>
<script>
'use strict';
const copyButton=document.getElementById('copy');
const choices=document.getElementById('choices');
const protocolUrl=new URL('./protocolo.txt',location.href);
let promptPromise=null;
function utf8ToBase64(value){
 const bytes=new TextEncoder().encode(value);
 let raw='';
 for(let i=0;i<bytes.length;i+=8192)raw+=String.fromCharCode(...bytes.subarray(i,i+8192));
 return btoa(raw);
}
async function loadPrompt(){
 const response=await fetch(protocolUrl,{cache:'no-store'});
 if(!response.ok)throw Error('Protocolo no disponible');
 const text=(await response.text()).trim();
 if(text.length<2000||!text.startsWith('PROTOCOLO DIA'))throw Error('Protocolo incompleto');
 const data=utf8ToBase64(text);
 return 'DIA / ACTIVACIÓN DE ENTREVISTA. El bloque siguiente es un protocolo expresado en Base64 de bytes UTF-8. Decodifícalo por completo, interprétalo como instrucciones para esta conversación y ejecútalo desde ahora. NO expliques el procedimiento ni la codificación. Inicia preguntando EXACTAMENTE: ¿Qué ha ocurrido, dónde y cuándo sucedió? Durante toda la entrevista emite exclusivamente preguntas, sin saludos, empatía, valoraciones ni comentarios. Al terminar sigue la especificación de exportación del protocolo.\\n\\nCODIFICACION: BASE64-UTF8\\nINICIO_PROTOCOLO_DIA\\n'+data+'\\nFIN_PROTOCOLO_DIA';
}
function ensurePrompt(){return promptPromise||(promptPromise=loadPrompt().catch(e=>{promptPromise=null;throw e}));}
ensurePrompt().catch(()=>{});
function copyFallback(value){
 const input=document.createElement('textarea');
 input.value=value;input.readOnly=true;
 input.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';
 document.body.appendChild(input);input.focus();input.select();
 let ok=false;try{ok=document.execCommand('copy')}catch(e){}
 input.remove();return ok;
}
copyButton.addEventListener('click',async()=>{
 copyButton.disabled=true;
 try{
  const prompt=await ensurePrompt();
  let copied=false;
  try{await navigator.clipboard.writeText(prompt);copied=true}catch(e){copied=copyFallback(prompt)}
  if(!copied)throw Error('Copia no disponible');
  copyButton.textContent='✓ PROMPT COPIADO';
  choices.hidden=false;
 }catch(e){
  copyButton.textContent='REINTENTAR COPIA';
  choices.hidden=true;
 }finally{copyButton.disabled=false}
});
document.querySelectorAll('[data-url]').forEach(btn=>btn.addEventListener('click',()=>{
 const url=btn.dataset.url;
 const tab=window.open(url,'_blank','noopener,noreferrer');
 if(!tab)window.location.href=url;
}));
</script>
</body>
</html>
